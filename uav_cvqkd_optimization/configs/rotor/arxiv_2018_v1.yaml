name: arxiv_2018_v1
source:
  title: Energy Minimization for Wireless Communication with Rotary-Wing UAV
  authors: [Yong Zeng, Jie Xu, Rui Zhang]
  version: arXiv 1804.02238v1, 6 April 2018
  url: https://arxiv.org/pdf/1804.02238v1
  verification: VERIFIED_PRIMARY_WEB_IN_PRIOR_AUDIT
  audit: docs/parameter_provenance.md
  table_I: 'PDF p.27'
  maximum_speed: 'Section V, PDF p.22'
  power_equation: 'Eq.(6), PDF p.6'
  coefficient_equation: 'Eq.(61), PDF p.27'
aircraft:
  weight_N: 100.0
  air_density_kg_m3: 1.225
  rotor_radius_m: 0.5
