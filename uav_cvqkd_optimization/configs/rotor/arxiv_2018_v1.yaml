  rotor_angular_speed_rad_s: 400.0
  rotor_tip_speed_m_s: 200.0
  blade_count: 4
  blade_chord_m: 0.0196
  rotor_solidity: 0.05
  fuselage_equivalent_flat_plate_area_m2: 0.0118
  fuselage_drag_ratio: 0.3
  induced_power_correction_factor: 0.1
  blade_profile_drag_coefficient: 0.012
  mean_induced_velocity_hover_m_s: 7.2
  maximum_speed_m_s: 60.0
# Preserve the original paper.yaml/table-value convention for this legacy set.
induced_velocity_policy: table_value
numerics:
  plot_samples: 1201
  grid_samples: 20001
  optimizer_xatol_m_s: 0.0000000001
