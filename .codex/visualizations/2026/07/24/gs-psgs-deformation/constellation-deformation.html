      const make = (name, attrs = {}) => {

      const format = value => Math.abs(value) < 1e-6 ? "0" : value.toFixed(3);
      function draw(panel, amplification) {
        const svg = panel.svg;
        svg.replaceChildren();
        svg.setAttribute("viewBox", "0 0 560 500");
        const margin = { left: 54, right: 18, top: 14, bottom: 48 };
        const width = 560 - margin.left - margin.right;
        const height = 500 - margin.top - margin.bottom;
        const d = dataset[panel.key];
        const maxAmp = 20;
        const all = [];
        d.ref.forEach((r,i) => {
          const a=d.after[i], dx=a[0]-r[0], dy=a[1]-r[1];
          all.push(r[0],r[1],r[0]+maxAmp*dx,r[1]+maxAmp*dy);
        });
        const extent = Math.max(...all.map(Math.abs)) * 1.08;
        const x = value => margin.left + (value + extent) / (2*extent) * width;
        const y = value => margin.top + (extent - value) / (2*extent) * height;
        const ticks = [-1,-.5,0,.5,1].map(v => v*extent);
        ticks.forEach((tick, index) => {
          const gx=x(tick), gy=y(tick);
          svg.appendChild(make("line",{x1:gx,y1:margin.top,x2:gx,y2:margin.top+height,class:index===2?"axis-line":"grid-line"}));
          svg.appendChild(make("line",{x1:margin.left,y1:gy,x2:margin.left+width,y2:gy,class:index===2?"axis-line":"grid-line"}));
          const tx=make("text",{x:gx,y:margin.top+height+18,"text-anchor":"middle",class:"tick-label"});
          tx.textContent=format(tick); svg.appendChild(tx);
          const ty=make("text",{x:margin.left-8,y:gy+4,"text-anchor":"end",class:"tick-label"});
          ty.textContent=format(tick); svg.appendChild(ty);
        });
        d.ref.forEach((r,i) => {
          const a=d.after[i], dx=a[0]-r[0], dy=a[1]-r[1];
          const ax=r[0]+amplification*dx, ay=r[1]+amplification*dy;
          const mag=Math.hypot(dx,dy);

          svg.appendChild(make("circle",{cx:x(r[0]),cy:y(r[1]),r:2.15,class:"reference-point"}));
          const point=make("circle",{cx:x(ax),cy:y(ay),r:2.5+2.2*mag/d.max,class:"after-point",fill:panel.color});

          point.addEventListener("focus",show);
