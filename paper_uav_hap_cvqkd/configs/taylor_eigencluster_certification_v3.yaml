arithmetic:
  backend: python-flint Arb/acb inclusion arithmetic
  python_flint_version: 0.9.0
  flint_version: 3.6.0
  diagnostic_midpoint_backend: numpy complex128 eigh; diagnostic only
  exact_binary64_embedding: exact integer-ratio dyadics
  flint_threads: 1
precision_bits: [160, 256, 384, 512]

taylor:
  scalar_path: theta(t)=theta_0+t*(theta_1-theta_0)
  order: 2
  remainder: rigorous cubic coefficient interval over each complete smooth cell
  coefficient_congruence: form Q_star_G_j_Q for j=0,1,2 before entrywise interval widening
  shifted_constant: Q_star_G_0_Q minus tau times Q_star_Q
  relu_rule: exact Fraction roots; split before Taylor evaluation
  exact_c4_reduction: four 64-dimensional Hermitian DFT sectors
path_domain:
  maximum_subdivision_depth: 8
  required_status: PATH_DOMAIN_CERTIFIED
  persistence: hash-chained journal commit before spectral work
  crossing_requires_certified_continuity: true

eigencluster:
  true_near_size_per_sector: 8
  construction_rule: nearest absolute shifted midpoint distance then original index
  unresolved_far_never_reclassified_as_near: true
far_elimination:
  sign_groups: [POSITIVE, NEGATIVE]
  candidate_order: greatest absolute shifted midpoint distance; POSITIVE before NEGATIVE on ties; then original index
  block_size_schedule: [32, 16, 8, 4, 2, 1]
  failed_block_action: retry same ordered prefix at next smaller size
  failed_singleton_action: retain as UNRESOLVED_FAR
  sign_acceptance: validated homogeneous block inertia only
schur:
  solve: python-flint acb_mat.solve algorithm precond
  explicit_inverse_permitted: false
  acceptance: finite validated solution and residual inclusions contain zero
  inertia_identity: inertia(H)=sum eliminated inertias+inertia(final Schur matrix)

subdivision:
  strategy: deterministic depth-first dyadic after failed node certificate
  maximum_depth: 12
  maximum_nodes_per_segment: 31
  exact_gap_free_coverage_required: true
resources:
  platform: Windows
  enforcement: CreateProcessW suspended; assign complete tree to kill-on-close Job Object; resume; TerminateJobObject at deadline
  watchdog_poll_seconds: 0.05
  kill_grace_seconds: 1.5
  finalization_allowance_seconds: 0.5
  maximum_timeout_overshoot_seconds: 2.0
  maximum_seconds_per_segment: 420
  maximum_feasibility_seconds: 1800
  maximum_full_cycle_seconds: 5400
  journal_durability: append-only hash chain; flush and fsync after every event

selection:
  namespace: whole-segment-v3-feasibility
  candidate_states: [bad, medium, good]
  candidate_families: [ps, gs, va, mixed]
  score_serialization: namespace NUL roster_sha256 NUL fixture_bundle_sha256 NUL family NUL state_label NUL canonical_segment_identity_sha256
  rule: independently per family choose lexicographically smallest SHA256 score; tie by ASCII state_label
  resolve_only_after_preselection_manifest_is_committed: true

